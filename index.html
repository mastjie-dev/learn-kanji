<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./tailwind.js"></script>
    <script defer src="./alpine.min.js"></script>
</head>
<body>
<div class="min-h-screen bg-slate-50 text-slate-900">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center justify-between px-4">
      <div>
        <p class="text-xs font-medium text-slate-500">KANJI JOURNEY</p>
        <h1 class="text-lg font-bold">Collections</h1>
      </div>
    </div>
  </header>

  <main x-data="homepage" class="mx-auto max-w-lg px-4 pb-24">
    <!-- Overall progress -->
    <section class="py-6">
      <div class="mb-3 flex items-end justify-between">
        <div>
          <p class="text-sm text-slate-500">Your progress</p>
          <p class="text-2xl font-bold" x-text="Math.floor(current/2136*100) + ' %'"></p>
        </div>

        <p class="text-sm text-slate-500">
        <span x-text="current"></span> / 2,136 kanji
        </p>
      </div>

    </section>

    <!-- Collections -->
    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-bold">Levels</h2>
      </div>
      <div class="space-y-3">
        <template x-for="menu in menulist">  
        <!-- Collection -->
        <button class="w-full rounded-2xl border border-slate-200 bg-white p-4
            text-left shadow-sm transition active:scale-[0.98]" @click="handleClick(menu.id)">
          
            <div class="flex items-start gap-4">
                <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl
                             bg-indigo-50 text-sm font-bold text-indigo-600" x-text="'0' + menu.id"></div>

                <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between">
                        <h3 class="font-semibold" x-text="menu.name"></h3>
                        <span class="text-xs font-medium text-slate-400"
                            x-text="menu.count + ' kanji'"></span>
                    </div>
                    <p class="mt-1 text-sm text-slate-500" x-text="menu.description"></p>
                </div>
          </div>
        </button>
        </template>
      </div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-lg items-center justify-around">

      <button class="flex flex-col items-center gap-1 text-indigo-600">
        <span>⌂</span>
        <span class="text-[11px] font-medium">Home</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>📚</span>
        <span class="text-[11px] font-medium">Lessons</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>📊</span>
        <span class="text-[11px] font-medium">Progress</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>⚙</span>
        <span class="text-[11px] font-medium">Settings</span>
      </button>

    </div>
  </nav>

</div>    
<script src="./common.js"></script>    
<script>
    const homepage = () => ({
        current: 50,
        menulist: [
            {
                id: "LVL5",
                name: "JLPT N5",
                count: 79,
                description: "Beginner Kanji Essentials",
            },
            {
                id: "LVL4",
                name: "JLPT N4",
                count: 166,
                description: "Elementary Kanji Foundations",
            },
            {
                id: "LVL3",
                name: "JLPT N3",
                count: 367,
                description: "Intermediate Kanji Expansion",
            },
            {
                id: "LVL2",
                name: "JLPT N2",
                count: 367,
                description: "Advanced Kanji Proficiency",
            },
            {
                id: "LVL1",
                name: "JLPT N1",
                count: 985,
                description: "Mastery Kanji & Literacy",
            },
            {
                id: "OTHR",
                name: "OTHER",
                count: 172,
                description: "",
            },
        ],
    })

    function handleClick(lvl) {
        window.location.href = "./lesson-group.html?lvl=" + lvl
    }

    document.addEventListener("alpine:init", () => {
        Alpine.data("homepage", homepage)
    })
</script>
</body>
</html>
