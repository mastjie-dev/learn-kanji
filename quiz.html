<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./tailwind.js"></script>
    <script defer src="./alpine.min.js"></script>
</head>
<body>

<div class="min-h-screen bg-slate-50 text-slate-900" x-data="PageComponent()">
    <!-- Header -->
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex h-16 max-w-lg items-center gap-3 px-4">
            <button
                class="flex h-10 w-10 items-center justify-center rounded-xl
                   text-slate-600 hover:bg-slate-100" aria-label="Exit quiz">
            ×
            </button>

            <div class="flex-1">
                <div class="mb-2 flex items-center justify-between">
                    <span class="text-xs font-medium text-slate-400">
                        Question 4 of 15
                    </span>
                    <span class="text-xs font-semibold text-indigo-600">
                        80%
                    </span>
                </div>

                <div class="h-2 overflow-hidden rounded-full bg-slate-200">
                    <div class="h-full w-[27%] rounded-full bg-indigo-500"></div>
                </div>
            </div>
        </div>
    </header>
    <!-- End: Header -->

    <main class="mx-auto max-w-lg px-4 py-8 pb-32">
        <!-- Question type -->
        <div class="text-center">
              <span
                class="inline-flex rounded-full bg-indigo-50 px-3 py-1.5
                       text-xs font-bold uppercase tracking-wide text-indigo-600">
                Kunyomi
              </span>
              <p class="mt-5 text-sm font-medium text-slate-500">
                How is this kanji read in kunyomi?
              </p>
        </div>

        <!-- Kanji -->
        <div class="mt-6 flex h-52 items-center justify-center
                 rounded-3xl border border-slate-200 bg-white shadow-sm">
          <span class="text-9xl font-medium leading-none"
              x-text="plate.kanji"></span>
        </div>

        <!-- Answers -->
        <div class="mt-8 space-y-3">
            <!-- Wrong -->
            <template x-for="(c, i) in choices" :key="i">
                <div>
                <template x-if="!freeze">
                    <button @click="pickAnswer(i)" 
                           class="flex min-h-[60px] w-full items-center
                           rounded-2xl border-2 border-slate-200 bg-white
                           px-4 text-left transition
                           hover:border-indigo-300 active:scale-[0.99]">
                        <span class="mr-4 flex h-9 w-9 shrink-0 items-center justify-center
                              rounded-xl bg-slate-100 text-sm font-bold text-slate-500"
                              x-text="chars[i]">
                        </span>
                        <span class="text-lg font-semibold" x-text="c.text"></span>
                    </button>
                </template>
                <template x-if="freeze">
                    <div>
                    <template x-if="c.pick && c.text === plate.answer">
                        <button class="flex min-h-[60px] w-full items-center rounded-2xl border-2
                                border-emerald-400 bg-emerald-50 px-4 text-left transition">
                            <span class="mr-4 flex h-9 w-9 shrink-0 items-center justify-center 
                                  rounded-xl bg-emerald-100 text-sm font-bold text-emerald-600"
                                  x-text="chars[i]">
                            </span>
                            <span class="text-lg font-semibold text-emerald-800"
                                x-text="c.text">
                            </span>
                        </button>
                    </template>
                    <template x-if="c.pick && c.text !== plate.answer">
                        <button class="flex min-h-[60px] w-full items-center rounded-2xl 
                                border-2 border-rose-300 bg-rose-50 px-4 text-left transition">
                            <span class="mr-4 flex h-9 w-9 shrink-0 items-center justify-center 
                                  rounded-xl bg-rose-100 text-sm font-bold text-rose-500"
                                  x-text="chars[i]">
                            </span>
                            <span class="text-lg font-semibold text-rose-800" 
                                x-text="c.text"></span>
                        </button>
                    </template>
                    <template x-if="!c.pick">
                        <button @click="pickAnswer(i)" 
                                class="flex min-h-[60px] w-full items-center
                                rounded-2xl border-2 border-slate-200 bg-white
                                px-4 text-left transition
                                hover:border-indigo-300 active:scale-[0.99]">
                            <span class="mr-4 flex h-9 w-9 shrink-0 items-center justify-center
                              rounded-xl bg-slate-100 text-sm font-bold text-slate-500"
                              x-text="chars[i]">
                            </span>
                            <span class="text-lg font-semibold" x-text="c.text"></span>
                        </button>
                    </template>
                    </div>
                </template>
                </div>
            </template>
        </div>
    </main>

    <!-- Bottom action -->
    <div class="fixed inset-x-0 bottom-0 border-t border-slate-200
         bg-white/95 p-4 backdrop-blur">
        <div class="mx-auto max-w-lg">
            <button @click="increment"
                    class="h-14 w-full rounded-2xl bg-indigo-600
                    font-bold text-white shadow-lg shadow-indigo-200
                    active:scale-[0.98]">
                <span x-text="index < 4 ? 'Next Question' : 'Back'"></span>
            </button>
        </div>
    </div>
    <!-- End: Bottom action -->
</div>

<script src="./common.js"></script>
<script>
function PageComponent() {
    return {
        index: -1,
        freeze: false,
        chars: ['A', 'B', 'C', 'D'],
        selected: [],
        means: [],
        kreads: [], 
        oreads: [],
        plate: {
            type: 0,
            kanji: "",
            answer: "",
            choices: [],
        },
        increment () {
            this.index++
            if (this.index >= 5) {
                const params = new URLSearchParams(window.location.search);
                const lvl = params.get("lvl")
                window.location.href = `./lesson-group.html?lvl=${lvl}`
                return
            }
            this.freeze = false
            const current = this.selected[this.index]
            this.plate.kanji = current.kanji
            this.plate.answer = current.mean[Math.floor(Math.random()
                * current.mean.length)]
            const r = this.means.filter(m => !current.mean.includes(m))
            shuffle(r)
            this.choices = [
                { pick: false, text: this.plate.answer },
                { pick: false, text: r.pop() },
                { pick: false, text: r.pop() },
                { pick: false, text: r.pop() }
            ]
            shuffle(this.choices)
        },
        pickAnswer(i) {
            if (this.freeze) return
            this.freeze = true
            this.choices[i].pick = true
            const c = this.choices.find(c => c.text === this.plate.answer)
            c.pick = true
        },
        init() {    
            const params = new URLSearchParams(window.location.search);
            const id = +params.get("id")
            const lvl = params.get("lvl")

            const rawstr = localStorage.getItem(lvl)
            const kanjis = JSON.parse(rawstr)
            const idx = Math.max(0, id-1) * 5
            this.selected = kanjis.slice(idx, idx + 5)
            this.selected.forEach(obj => {
                obj.mean.forEach(m => this.means.push(m))
                obj.kread.forEach(k => this.kreads.push(k))
                obj.oread.forEach(o => this.oreads.push(o))
            })
            this.increment()
        }
    }
}
      
</script>
</body>
</html>
