<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./tailwind.js"></script>
    <script defer src="./alpine.min.js"></script>
</head>
<body>

<div class="min-h-screen bg-slate-50 text-slate-900" x-data="kanjiData()">
    <!-- Header -->
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95
        backdrop-blur">
        <div class="mx-auto flex h-16 max-w-lg items-center gap-3 px-4">
            <button
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl
                   text-slate-600 hover:bg-slate-100"
            aria-label="Back">
            ←
            </button>

            <div class="min-w-0 flex-1">
                <p class="truncate text-xs font-medium text-slate-400">
                    JLPT N5 · Lesson 03
                </p>
                <h1 class="truncate font-bold">People & Relationships</h1>
            </div>

            <span class="text-sm font-semibold text-slate-500">8 / 12</span>
        </div>
    </header>
    <!-- End Header -->

    <main class="mx-auto max-w-lg px-4 pb-32">
        <template x-if="loading">
            <p>Loading...</p>
        </template>

        <template x-if="!loading">
            <div>
                <!-- Lesson progress -->
                <div class="py-5">
                    <div class="mb-2 flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-500">
                          Lesson progress
                        </span>
                        <span class="text-xs font-semibold text-indigo-600">
                          67%
                        </span>
                    </div>
                    <div class="h-2 overflow-hidden rounded-full bg-slate-200">
                        <div class="h-full w-[67%] rounded-full bg-indigo-500"></div>
                    </div>
                </div>
                <!-- End Lesson progress -->

                <!-- Kanji card -->
                <section class="overflow-hidden rounded-3xl border
                         border-slate-200 bg-white shadow-sm">
                    <!-- Kanji -->
                    <div class="flex flex-col items-center px-6 pb-8 pt-10">
                        <span class="mb-5 rounded-full bg-indigo-50 px-3 py-1 text-xs
                              font-semibold text-indigo-600">
                            Kanji <span x-text="current+1"></span>
                        </span>
                        <div class="flex h-40 w-40 items-center justify-center rounded-3xl bg-slate-50">
                          <span class="text-8xl font-medium leading-none"
                                x-text="kanjis[current].kanji">
                          </span>
                        </div>
                        <div class="mt-7 text-center">
                          <p class="mt-4 text-lg font-semibold text-indigo-600">
                            <span x-text="kanjis[current].mean.join(', ')"></span>
                          </p>
                        </div>
                    </div>
                    <!-- Divider -->
                    <div class="border-t border-slate-100"></div>
                    <div class="p-5"></div>
                </section>
                <!-- End: Kanji card -->
    
                <!-- Kun'yomi -->
                <section class="mt-6">
                    <div class="space-y-3">
                        <div class="rounded-2xl border border-slate-200 bg-white p-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-md font-bold">Kun'yomi</p>
                                </div>
                            </div>

                            <p class="mt-3 text-lg text-slate-600">
                                <span x-text="kanjis[current].kread.join(', ')"></span>
                            </p>
                        </div>
                    </div>
                </section>
                <!-- End: Kun'yomi -->
            
                <!-- On'yomi -->
                <section class="mt-6">
                    <div class="space-y-3">
                        <div class="rounded-2xl border border-slate-200 bg-white p-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-md font-bold">On'yomi</p>
                                </div>
                            </div>

                            <p class="mt-3 text-lg text-slate-600">
                                <span x-text="kanjis[current].oread.join(', ')"></span>
                            </p>
                        </div>
                    </div>
                </section>
                <!-- End: On'yomi -->

            </div>
        </template>    
    </main>

    <!-- Bottom action -->
    <div class="fixed inset-x-0 bottom-0 z-20 border-t border-slate-200 bg-white/95 p-4 backdrop-blur">
        <div class="mx-auto flex max-w-lg flex-row justify-center gap-4">
            <!-- Previous Button -->
            <button @click="decrement"
                :disabled="current === 0"
                class="flex h-14 w-1/3 items-center justify-center gap-2 rounded-2xl bg-slate-600 
                           font-bold text-white shadow-lg shadow-slate-200 transition hover:bg-slate-700 
                           active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-300 
                           disabled:shadow-none disabled:active:scale-100">
                Previous 
            </button>
            <!-- Next / Quiz Button -->
            <button @click="increment"
                    :class="current === 4 ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200' 
                            : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200'"
                    class="flex h-14 w-1/3 items-center justify-center gap-2
                           rounded-2xl font-bold text-white shadow-lg transition active:scale-[0.98]">
                <span x-text="current === 4 ? 'Quiz' : 'Next'"></span>
            </button>
        </div>
    </div>
    <!-- End: Bottom action -->
</div>

<script>
    function kanjiData() { return {  
        kanjis: [],
        loading: true,
        current: 0,
        increment() {
            this.current++
            if (this.current > 4) {
                this.current = 4
                const params = new URLSearchParams(window.location.search);
                const id = +params.get("id")
                const lvl = params.get("lvl")
                window.location.href = `./quiz.html?lvl=${lvl}&id=${id}`
            }
        },
        decrement() {
            this.current--
            if (this.current < 0) this.current = 0
        },
        async init() {
            
            const params = new URLSearchParams(window.location.search);
            const id = +params.get("id")
            const lvl = params.get("lvl")
                       
            const rawstr = localStorage.getItem(lvl) 
            if (rawstr !== null) {
                const json = JSON.parse(rawstr)
                const index = Math.max(0, id-1) * 5
                this.kanjis = json.slice(index, index + 5)
                this.loading = false
            } 
        }
    }}
   
</script>

</body>
</html>
