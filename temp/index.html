<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./tailwind.js"></script>
    <script defer src="./alpine.min.js"></script>
</head>
<body>
<div class="min-h-screen bg-slate-50 text-slate-900">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center justify-between px-4">
      <div>
        <p class="text-xs font-medium text-slate-500">KANJI JOURNEY</p>
        <h1 class="text-lg font-bold">Collections</h1>
      </div>

      <button
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100"
        aria-label="Menu"
      >
        ☰
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 pb-24">

    <!-- Overall progress -->
    <section class="py-6">
      <div class="mb-3 flex items-end justify-between">
        <div>
          <p class="text-sm text-slate-500">Your progress</p>
          <p class="text-2xl font-bold">72%</p>
        </div>

        <p class="text-sm text-slate-500">
          1,584 / 2,200 kanji
        </p>
      </div>

      <div class="h-2 overflow-hidden rounded-full bg-slate-200">
        <div class="h-full w-[72%] rounded-full bg-indigo-500"></div>
      </div>
    </section>

    <!-- Collections -->
    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-bold">Collections</h2>
        <span class="text-sm text-slate-500">22 collections</span>
      </div>

      <div class="space-y-3">

        <!-- Collection -->
        <button class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm transition active:scale-[0.98]">
          <div class="flex items-start gap-4">

            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-sm font-bold text-indigo-600">
              01
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <h3 class="font-semibold">JLPT N5</h3>
                <span class="text-xs font-medium text-slate-400">
                  80 kanji
                </span>
              </div>

              <p class="mt-1 text-sm text-slate-500">
                Beginner kanji essentials
              </p>

              <div class="mt-3 flex items-center gap-3">
                <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100">
                  <div class="h-full w-[80%] rounded-full bg-emerald-500"></div>
                </div>

                <span class="text-xs font-semibold text-emerald-600">
                  80%
                </span>
              </div>
            </div>

            <span class="mt-1 text-slate-300">›</span>
          </div>
        </button>

        <!-- Collection -->
        <button class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm transition active:scale-[0.98]">
          <div class="flex items-start gap-4">

            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-violet-50 text-sm font-bold text-violet-600">
              02
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <h3 class="font-semibold">JLPT N4</h3>
                <span class="text-xs font-medium text-slate-400">
                  120 kanji
                </span>
              </div>

              <p class="mt-1 text-sm text-slate-500">
                Elementary kanji
              </p>

              <div class="mt-3 flex items-center gap-3">
                <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100">
                  <div class="h-full w-[50%] rounded-full bg-indigo-500"></div>
                </div>

                <span class="text-xs font-semibold text-indigo-600">
                  50%
                </span>
              </div>
            </div>

            <span class="mt-1 text-slate-300">›</span>
          </div>
        </button>

      </div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-lg items-center justify-around">

      <button class="flex flex-col items-center gap-1 text-indigo-600">
        <span>⌂</span>
        <span class="text-[11px] font-medium">Home</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>📚</span>
        <span class="text-[11px] font-medium">Lessons</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>📊</span>
        <span class="text-[11px] font-medium">Progress</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-slate-400">
        <span>⚙</span>
        <span class="text-[11px] font-medium">Settings</span>
      </button>

    </div>
  </nav>

</div>
</body>
</html>
